name: ci
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # FreeIPA runs systemd inside the container. It is started here as a service
    # container; the default command is `ipa-server-install`, driven unattended
    # via IPA_SERVER_INSTALL_OPTS + PASSWORD. cgroup access is granted through
    # the container options below (privileged mode is unsupported by the image).
    services:
      freeipa:
        image: quay.io/freeipa/freeipa-server:almalinux-9
        env:
          PASSWORD: Secret123
          IPA_SERVER_INSTALL_OPTS: "-U -r EXAMPLE.TEST --no-ntp --no-ui-redirect --skip-mem-check"
        ports:
          - "389:389"
          - "636:636"
        options: >-
          --hostname ipa.example.test
          --sysctl net.ipv6.conf.all.disable_ipv6=0
          --cgroupns=host
          --volume /sys/fs/cgroup:/sys/fs/cgroup:rw
    env:
      BATON_LOG_LEVEL: debug
      BATON_URL: "ldaps://localhost:636"
      BATON_BIND_DN: "uid=admin,cn=users,cn=accounts,dc=example,dc=test"
      BATON_BASE_DN: "dc=example,dc=test"
      BATON_PASSWORD: "Secret123"
      BATON_INSECURE_SKIP_VERIFY: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Wait for FreeIPA to finish installing
        env:
          FREEIPA_CID: ${{ job.services.freeipa.id }}
        run: |
          set -euo pipefail
          echo "FreeIPA container: $FREEIPA_CID"

          # ipa-server-install takes several minutes. A successful kinit only
          # proves the KDC is up, so also require `ipa ping`, which exercises
          # the IPA API through httpd — the seed step depends on it.
          ready=0
          for i in $(seq 1 60); do
            if ! docker ps --filter "id=$FREEIPA_CID" --filter "status=running" --format '{{.ID}}' | grep -q .; then
              echo "::error::FreeIPA container is no longer running"
              docker logs "$FREEIPA_CID" | tail -100 || true
              exit 1
            fi
            if docker exec "$FREEIPA_CID" bash -c 'echo "$PASSWORD" | kinit admin && ipa ping' >/dev/null 2>&1; then
              echo "FreeIPA is ready after $((i*15))s"
              ready=1
              break
            fi
            echo "Waiting for FreeIPA... attempt $i"
            sleep 15
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::FreeIPA did not become ready in time"
            docker logs "$FREEIPA_CID" | tail -200 || true
            exit 1
          fi

      - name: Seed FreeIPA test fixtures
        env:
          FREEIPA_CID: ${{ job.services.freeipa.id }}
        run: |
          set -euo pipefail
          docker cp scripts/freeipa-seed.sh "$FREEIPA_CID:/tmp/freeipa-seed.sh"
          # The host fqdn is passed explicitly so the lookup step below can
          # address the fixture by DN.
          docker exec -e BATON_TEST_HOST=host1.example.test \
            "$FREEIPA_CID" bash /tmp/freeipa-seed.sh

      # The connector uses ipaUniqueID (users, groups, hosts, host groups) and
      # entryUUID (roles) as resource IDs. FreeIPA generates these at creation time, so the
      # entitlement/principal IDs for the sync-test action must be read back
      # from the directory after seeding rather than hardcoded.
      - name: Look up fixture resource IDs
        id: fixtures
        env:
          FREEIPA_CID: ${{ job.services.freeipa.id }}
        run: |
          set -euo pipefail
          lookup() {
            docker exec "$FREEIPA_CID" ldapsearch -LLL -o ldif-wrap=no \
              -x -H ldap://localhost:389 \
              -D "cn=Directory Manager" -w "$BATON_PASSWORD" \
              -s base -b "$1" "$2" \
              | awk -v attr="$2:" 'tolower($1) == tolower(attr) {print $2}'
          }
          USER_ID=$(lookup "uid=testuser1,cn=users,cn=accounts,dc=example,dc=test" ipaUniqueID)
          USER2_ID=$(lookup "uid=testuser2,cn=users,cn=accounts,dc=example,dc=test" ipaUniqueID)
          GROUP_ID=$(lookup "cn=testgroup1,cn=groups,cn=accounts,dc=example,dc=test" ipaUniqueID)
          ROLE_ID=$(lookup "cn=testrole1,cn=roles,cn=accounts,dc=example,dc=test" entryUUID)
          HOST_ID=$(lookup "fqdn=host1.example.test,cn=computers,cn=accounts,dc=example,dc=test" ipaUniqueID)
          HOSTGROUP_ID=$(lookup "cn=testhostgroup1,cn=hostgroups,cn=accounts,dc=example,dc=test" ipaUniqueID)
          for v in USER_ID USER2_ID GROUP_ID ROLE_ID HOST_ID HOSTGROUP_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::$v lookup returned empty"
              exit 1
            fi
          done
          {
            echo "user-id=$USER_ID"
            echo "user2-id=$USER2_ID"
            echo "group-id=$GROUP_ID"
            echo "role-id=$ROLE_ID"
            echo "host-id=$HOST_ID"
            echo "hostgroup-id=$HOSTGROUP_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Build baton-ipa
        run: go build ./cmd/baton-ipa

      # The standalone conductorone/baton CLI trails baton-sdk releases (it was
      # last built against baton-sdk v0.8.24), so it can't read a c1z file
      # written by this connector's newer, pebble-store-backed SDK version and
      # fails with "c1z: invalid file". get-baton installs the baton binary
      # built from conductorone/baton-sdk instead, which stays in step.
      - name: Install baton
        uses: ConductorOne/github-workflows/actions/get-baton@v4

      - name: Check baton version
        run: baton --version

      # CXP-842 regression guard. Every assertion below is a grant or
      # entitlement the connector can only produce by resolving an LDAP DN from
      # the resource handed back to Grants()/Entitlements(). That used to be
      # read from Resource.ExternalId, which c1 does not persist, so all of this
      # failed in hosted mode with "has no external ID" while a CLI sync passed.
      - name: Test sync resolves DNs for every resource type
        env:
          USER_ID: ${{ steps.fixtures.outputs.user-id }}
          USER2_ID: ${{ steps.fixtures.outputs.user2-id }}
          GROUP_ID: ${{ steps.fixtures.outputs.group-id }}
          ROLE_ID: ${{ steps.fixtures.outputs.role-id }}
          HOST_ID: ${{ steps.fixtures.outputs.host-id }}
          HOSTGROUP_ID: ${{ steps.fixtures.outputs.hostgroup-id }}
        run: |
          set -euo pipefail

          ./baton-ipa --file=sync.c1z

          assert_grant() {
            local entitlement="$1" principal="$2"
            if ! baton grants --file=sync.c1z --entitlement="$entitlement" --output-format=json \
              | jq --exit-status --arg p "$principal" \
                'any(.grants[]?; .principal.id.resource == $p)' >/dev/null; then
              echo "::error::no grant of '$entitlement' to '$principal'"
              return 1
            fi
            echo "ok: $entitlement -> $principal"
          }

          assert_entitlement() {
            local entitlement="$1"
            if ! baton entitlements --file=sync.c1z --output-format=json \
              | jq --exit-status --arg id "$entitlement" \
                'any(.entitlements[]?; .entitlement.id == $id)' >/dev/null; then
              echo "::error::entitlement '$entitlement' was not synced"
              return 1
            fi
            echo "ok: $entitlement"
          }

          # group.Grants - the failure reported in CXP-842
          assert_grant "group:$GROUP_ID:member" "$USER_ID"
          assert_grant "group:$GROUP_ID:manager" "$USER2_ID"

          # role.Grants, for both a user and a nested group member
          assert_grant "role:$ROLE_ID:member" "$USER_ID"
          assert_grant "role:$ROLE_ID:member" "$GROUP_ID"

          # host_group.Grants, static and HBAC-derived
          assert_grant "host_group:$HOSTGROUP_ID:member" "$HOST_ID"
          assert_grant "host_group:$HOSTGROUP_ID:manager" "$USER2_ID"
          assert_entitlement "host_group:$HOSTGROUP_ID:testhbac1"
          assert_grant "host_group:$HOSTGROUP_ID:testhbac1" "$USER_ID"

          # host.Entitlements/Grants. Hosts have no trait profile to carry a DN,
          # so these only appear if the DN was resolved by ipaUniqueID.
          assert_entitlement "host:$HOST_ID:testhbac1"
          assert_grant "host:$HOST_ID:testhbac1" "$USER_ID"

          # The inherited entitlement host_group.Entitlements projects onto each
          # member host.
          assert_entitlement "host:$HOST_ID:testhostgroup1 - testhbac1"
          assert_grant "host:$HOST_ID:testhostgroup1 - testhbac1" "$USER_ID"

      - name: Test group grant/revoke
        uses: ConductorOne/github-workflows/actions/sync-test@v4
        with:
          connector: ./baton-ipa
          baton-entitlement: "group:${{ steps.fixtures.outputs.group-id }}:member"
          baton-principal: ${{ steps.fixtures.outputs.user-id }}
          baton-principal-type: user

      # testuser2, not testuser1: the fixtures make testgroup1 a member of the
      # role and testuser1 a member of testgroup1, so grant expansion would
      # re-derive a role grant for testuser1 and the post-revoke check would
      # never see it go away. testuser2 only manages the group, and manager
      # grants are not expandable.
      - name: Test role grant/revoke
        uses: ConductorOne/github-workflows/actions/sync-test@v4
        with:
          connector: ./baton-ipa
          baton-entitlement: "role:${{ steps.fixtures.outputs.role-id }}:member"
          baton-principal: ${{ steps.fixtures.outputs.user2-id }}
          baton-principal-type: user

      # Role membership is grantable to hosts, and a host resource carries no DN
      # at all, so this is the provisioning path that has to resolve one by
      # ipaUniqueID.
      - name: Test role grant/revoke for a host principal
        uses: ConductorOne/github-workflows/actions/sync-test@v4
        with:
          connector: ./baton-ipa
          baton-entitlement: "role:${{ steps.fixtures.outputs.role-id }}:member"
          baton-principal: ${{ steps.fixtures.outputs.host-id }}
          baton-principal-type: host

      - name: Dump FreeIPA logs on failure
        if: failure()
        env:
          FREEIPA_CID: ${{ job.services.freeipa.id }}
        run: |
          docker logs "$FREEIPA_CID" | tail -300 || true
